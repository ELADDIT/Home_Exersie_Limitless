# Reusable workflow: runs one test set against one environment, then (on main only)
# publishes an Allure report with run history to GitHub Pages at /<env>/<suite>/.
name: run-suite

on:
  workflow_call:
    inputs:
      suite:
        description: "pytest marker to run: sanity | progression"
        required: true
        type: string
      env:
        description: "Target environment: prod | with-bugs"
        required: false
        type: string
        default: prod

env:
  ALLURE_VERSION: 2.46.1

jobs:
  test:
    name: ${{ inputs.suite }} (${{ inputs.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 5 # brief: the pipeline must finish within 5 minutes
    # Official Playwright image: browsers + system libraries preinstalled (installing them took ~2 min).
    # Its version must match `playwright==` in requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # The container is thrown away after the job, so installing into its system Python is fine
        # (it has no venv module).
        run: pip install -q --break-system-packages -r requirements.txt

      - name: Run ${{ inputs.suite }} tests (4 workers)
        env:
          TOOLSHOP_ENV: ${{ inputs.env }}
          TOOLSHOP_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          TOOLSHOP_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: >
          pytest -m ${{ inputs.suite }} -n 4
          --alluredir allure-results
          --junitxml junit.xml
          --tracing retain-on-failure --output test-results

      - name: Upload raw results and Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.env }}-${{ inputs.suite }}
          path: |
            allure-results
            test-results
            junit.xml
          retention-days: 14
          if-no-files-found: ignore

  publish:
    name: publish dashboard
    needs: test
    # Publish even when tests fail (that's when the report matters most), but only from main,
    # so PR branches never overwrite the team's dashboard history.
    if: always() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Runs for the same report path are serialised (keeps its history consistent); different paths
    # publish in parallel and the push below retries, since they touch different folders.
    concurrency:
      group: gh-pages-${{ inputs.env }}-${{ inputs.suite }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: results-${{ inputs.env }}-${{ inputs.suite }}
          path: results

      - name: Fetch previous report history
        run: |
          mkdir -p results/allure-results
          if git fetch --depth 1 origin gh-pages; then
            git worktree add --detach site FETCH_HEAD
            cp -r "site/${{ inputs.env }}/${{ inputs.suite }}/history" results/allure-results/ 2>/dev/null || echo "no history yet"
          else
            mkdir site
          fi

      - name: Add run metadata to the report
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.env }}/${{ inputs.suite }}/
        run: |
          cat > results/allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "buildOrder": ${{ github.run_number }},
           "buildName": "${{ github.workflow }} #${{ github.run_number }} (${{ github.event_name }})",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "$REPORT_URL", "reportName": "Toolshop ${{ inputs.suite }} (${{ inputs.env }})"}
          EOF
          # Categories: tell "the shared site was slow/unreachable" apart from real product failures.
          cat > results/allure-results/categories.json <<'EOF'
          [{"name": "Blocked by the site's bot protection (Cloudflare) - environment, not a product bug",
            "matchedStatuses": ["broken", "failed"], "messageRegex": ".*(BLOCKED BY BOT PROTECTION|Performing security verification).*"},
           {"name": "Shared site slow or unreachable (not a product bug)", "matchedStatuses": ["broken"],
            "messageRegex": ".*(ReadTimeout|ConnectTimeout|ConnectionError|handshake operation timed out|net::ERR_).*"},
           {"name": "Known app bug (expected to fail)", "matchedStatuses": ["skipped"], "messageRegex": ".*BUG:.*"},
           {"name": "Product failures", "matchedStatuses": ["failed"]},
           {"name": "Test errors", "matchedStatuses": ["broken"]}]
          EOF
          printf 'Environment=%s\nSuite=%s\nCommit=%s\nTrigger=%s\n' \
            "${{ inputs.env }}" "${{ inputs.suite }}" "${{ github.sha }}" "${{ github.event_name }}" \
            > results/allure-results/environment.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        run: npx --yes allure-commandline@${ALLURE_VERSION} generate results/allure-results --clean -o report

      - name: Publish report and dashboard page to gh-pages
        env:
          TARGET: ${{ inputs.env }}/${{ inputs.suite }}
          RUN_NUMBER: ${{ github.run_number }}
          TRIGGER: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export RUN_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf pages && git clone --quiet --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages \
              || { mkdir pages && git -C pages init -q -b gh-pages && git -C pages remote add origin \
                   "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"; }
            python3 .github/scripts/record_run.py "pages/$TARGET/runs.json" report/widgets/summary.json runs.json
            rm -rf "pages/$TARGET" && mkdir -p "pages/$TARGET" && cp -r report/. "pages/$TARGET/" && cp runs.json "pages/$TARGET/"
            cp -r .github/pages/. pages/ && touch pages/.nojekyll
            git -C pages add -A
            git -C pages commit -q -m "Dashboard: $TARGET run ${{ github.run_number }}" || exit 0
            git -C pages push -q origin gh-pages && exit 0
            echo "push raced with another run, retrying ($attempt)"; sleep $((attempt * 3))
          done
          exit 1

      - name: Link in job summary
        run: |
          echo "### Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ inputs.env }}/${{ inputs.suite }}/" >> "$GITHUB_STEP_SUMMARY"
