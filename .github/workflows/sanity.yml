name: sanity

# Fast critical-path check on every push (any branch), plus nightly on every environment.
on:
  push:
  schedule:
    - cron: "0 2 * * *" # nightly: prod AND with-bugs
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [prod, with-bugs]
        default: prod

# A newer push to the same branch makes an older sanity run irrelevant.
concurrency:
  group: sanity-${{ github.ref }}-${{ inputs.env || 'prod' }}
  cancel-in-progress: true

jobs:
  sanity:
    strategy:
      fail-fast: false
      matrix:
        # Nightly covers every environment; other triggers run the chosen one (prod by default).
        env: ${{ fromJSON(github.event_name == 'schedule' && '["prod","with-bugs"]' || format('["{0}"]', inputs.env || 'prod')) }}
    uses: ./.github/workflows/_run-suite.yml
    with:
      suite: sanity
      env: ${{ matrix.env }}
    secrets: inherit
