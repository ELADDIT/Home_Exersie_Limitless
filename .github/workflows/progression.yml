name: progression

# Broader feature checks: on pull requests, after merges to main, nightly, and on demand.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [prod, with-bugs]
        default: prod

concurrency:
  group: progression-${{ github.ref }}-${{ inputs.env || 'prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  progression:
    uses: ./.github/workflows/_run-suite.yml
    with:
      suite: progression
      env: ${{ inputs.env || 'prod' }}
    secrets: inherit
