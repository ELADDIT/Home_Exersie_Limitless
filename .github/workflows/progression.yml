name: progression

# Broader feature checks: on pull requests, after merges to main, nightly, and on demand.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [prod, with-bugs]
        default: prod

concurrency:
  group: progression-${{ github.ref }}-${{ inputs.env || 'prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  progression:
    strategy:
      fail-fast: false
      matrix:
        # Nightly covers every environment; other triggers run the chosen one (prod by default).
        env: ${{ fromJSON(github.event_name == 'schedule' && '["prod","with-bugs"]' || format('["{0}"]', inputs.env || 'prod')) }}
    uses: ./.github/workflows/_run-suite.yml
    with:
      suite: progression
      env: ${{ matrix.env }}
    secrets: inherit
