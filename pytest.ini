[pytest]
testpaths = tests
pythonpath = .
markers =
    sanity: critical-path set, runs on every push
    progression: broader set, runs on PRs, nightly and on demand
    api: REST API test (applied automatically to tests/api)
    ui: browser test (applied automatically to tests/ui); max 10 per suite
# Retry ONLY on network-level errors to the shared public service, never on assertion failures.
addopts =
    -ra
    --strict-markers
    --browser chromium
    --reruns 1
    --reruns-delay 2
    --only-rerun requests.exceptions.ConnectionError
    --only-rerun requests.exceptions.ReadTimeout
    --only-rerun net::ERR_
